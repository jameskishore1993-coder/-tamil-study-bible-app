name: Generate Tamil Bible APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Prepare Project and Fix Gradle
        run: |
          # 1. புதிய செயலியை உருவாக்குதல்
          flutter create --org com.tamilbible.study --project-name tamil_study_bible_app my_app
          cd my_app

          # 2. Assets அமைத்து தரவுத்தளத்தை வைத்தல்
          mkdir -p assets
          cp ../tamil_study_bible.db assets/

          # 3. Zip-ல் இருந்து main.dart எடுத்தல்
          unzip -o ../Tamil_Study_Bible_With_History_v3.zip -d temp_extracted/
          cp -f temp_extracted/lib/main.dart lib/main.dart
          rm -rf temp_extracted

          # 4. pubspec.yaml அமைத்தல்
          cat << 'EOF' > pubspec.yaml
          name: tamil_study_bible_app
          description: Tamil Offline Study Bible Android App
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            sqflite: ^2.3.0
            path: ^1.8.3

          flutter:
            uses-material-design: true
            assets:
              - assets/tamil_study_bible.db
          EOF

          # 5. Gradle minSdkVersion பிழையை முழுமையாக சரிசெய்தல்
          python3 -c "
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
          content = content.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Build Android Release APK
        run: |
          cd my_app
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Tamil-Bible-APK
          path: my_app/build/app/outputs/flutter-apk/app-release.apk
