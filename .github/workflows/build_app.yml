name: Deploy Tamil Bible Web App
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Web
        run: |
          flutter create --org com.tamilbible.study --project-name tamil_study_bible_app my_app
          cd my_app
          flutter pub add sqflite_common_ffi path
          mkdir -p assets
          cp ../tamil_study_bible.db assets/
          unzip -o ../Tamil_Study_Bible_With_History_v3.zip -d temp_extracted/
          cp -f temp_extracted/lib/main.dart lib/main.dart
          rm -rf temp_extracted
          sed -i '/uses-material-design: true/a \  assets:\n    - assets/tamil_study_bible.db' pubspec.yaml
          flutter build web --release

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./my_app/build/web
