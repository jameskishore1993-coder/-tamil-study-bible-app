name: Generate Tamil Bible APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'

      - name: Build Project
        run: |
          flutter create --org com.tamilbible.study --project-name tamil_study_bible_app bible_app
          cd bible_app
          mkdir -p assets
          cp ../tamil_study_bible.db assets/
          unzip -o ../Tamil_Study_Bible_With_History_v3.zip -d extracted/
          cp -f extracted/lib/main.dart lib/main.dart
          rm -rf extracted
          
          # Stable Android configurations
          echo "flutter.minSdkVersion=21" >> android/local.properties
          
          cat << 'EOF' > pubspec.yaml
          name: tamil_study_bible_app
          description: Tamil Study Bible
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            sqflite: ^2.3.0
            path: ^1.8.3
          flutter:
            uses-material-design: true
            assets:
              - assets/tamil_study_bible.db
          EOF

          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Tamil-Bible-APK
          path: bible_app/build/app/outputs/flutter-apk/app-release.apk
