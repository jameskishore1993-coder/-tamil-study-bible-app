name: Generate Tamil Bible APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'

      - name: Prepare and Build APK
        run: |
          # 1. புதிய சுத்தமான Flutter செயலியை உருவாக்குதல்
          flutter create --org com.tamilbible.study --project-name tamil_study_bible_app my_app
          cd my_app

          # 2. Assets கோப்பகத்தை அமைத்து தரவுத்தளத்தை வைத்தல்
          mkdir -p assets
          cp ../tamil_study_bible.db assets/

          # 3. Zip கோப்பிலிருந்து main.dart கோப்பை மட்டும் எடுத்தல்
          unzip -o ../Tamil_Study_Bible_With_History_v3.zip -d temp_extracted/
          cp -f temp_extracted/lib/main.dart lib/main.dart
          rm -rf temp_extracted

          # 4. முழுமையான pubspec.yaml கோப்பை பிழையின்றி உருவாக்குதல்
          cat << 'EOF' > pubspec.yaml
          name: tamil_study_bible_app
          description: Tamil Offline Study Bible Android App
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            sqflite: ^2.3.0
            path: ^1.8.3

          flutter:
            uses-material-design: true
            assets:
              - assets/tamil_study_bible.db
          EOF

          # 5. நூலகங்களை நிறுவுதல்
          flutter pub get

          # 6. Release APK உருவாக்குதல்
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Tamil-Bible-APK
          path: my_app/build/app/outputs/flutter-apk/app-release.apk
